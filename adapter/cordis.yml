# Opt-in overlay: replace the LOCAL execution world with a Docker container.
#
# Both seams must be swapped together -- they form one execution world. And the
# stock providers must be disabled first: cordis allows one implementation per
# service, so registering a second ctx.fs/ctx.subprocess throws.
#
#   fs-sandbox  -> registers ctx.fs  (SandboxedFileSystem extends LocalFileSystem)
#   subprocess  -> registers ctx.subprocess (@deepseek-ai/dsh-subprocess-local)
#
# Usage from a dsh checkout:
#   pnpm dsh web --patch /abs/path/to/dsh-worlds/adapter/cordis.yml
# Plugin paths MUST be absolute -- rewrite the three below for your machine.

# --- swap the execution world ---
# ctx.fs (SandboxedFileSystem extends LocalFileSystem)
- id: fs-sandbox
  disabled: true

# ctx.subprocess (local process trees)
- id: subprocess
  disabled: true

# --- retire host confinement ---
# The sandbox seam explicitly scopes itself to the host kernel: "Containers,
# microVMs, and remote execution replace the surrounding capability seam
# instead; this service shares the host kernel and filesystem." The container
# IS the boundary here, so these rows are not just unnecessary -- sandbox-local
# cannot fence a process that does not live on this kernel.
- id: sandbox
  disabled: true

# sandbox-policy STAYS ENABLED: it only *resolves* per-session policy, it does
# not enforce anything, and dsh-terminal-bash hard-requires ctx.sandboxPolicy.
# The bare Docker fs provider accepts the policy argument and ignores it, which
# is the documented behaviour for a non-sandboxing backend.
#
# Mode is forced to danger-full-access because HOST confinement is meaningless
# here: the process does not run on this kernel. Tools gate their availability
# on this mode, so leaving the default 'workspace-write' hides the terminal
# tool. The real boundary is the container.
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

# bash-sandbox is the sandbox-consuming executor, loaded "instead of"
# dsh-bash-local. Swap back to bash-local, which spawns through ctx.subprocess
# -- now the Docker provider.
- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

# permission-presets refuses to compose over an unconfined executor:
# "the mounted bash executor does not confine (no sandboxMode) -- presets bundle
# a sandbox mode, so composing this plugin over an unconfined executor is a
# misconfiguration". That guard assumes host-sandboxed bash. In a container
# world the container is the boundary, so the preset layer is retired with it.
#
# TRADE-OFF: per-call sandbox MODES (read-only / workspace-write) are no longer
# enforced at the bash layer. Confinement is now the container's, which is
# coarser -- it fences the host, not the workspace. Approval prompts for other
# tools are unaffected.
- id: permission
  disabled: true

- insert:
    - id: world
      name: '/Users/ashishdhiman/WORK/deepseek/dsh-worlds/adapter/world.ts'
      config:
        image: 'alpine:latest'
        containerName: 'dsh-world'
        workdir: '/workspace'

    - id: fs-docker
      name: '/Users/ashishdhiman/WORK/deepseek/dsh-worlds/adapter/fs.ts'

    - id: subprocess-docker
      name: '/Users/ashishdhiman/WORK/deepseek/dsh-worlds/adapter/subprocess.ts'

    # Unsandboxed bash executor: it delegates every execution-world operation
    # to ctx.subprocess, so it lands in the container with no fork required.
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'

    # Persistent PTY terminals. terminal-bash allocates through
    # ctx.subprocess.spawnTerminal -- now the Docker hijacked-exec PTY -- so
    # these need no fork either. The headless profile omits them by default.
    - id: terminal
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'

    - id: tool-terminal
      name: '@deepseek-ai/dsh-tool-terminal'
